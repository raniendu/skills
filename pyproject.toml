[project]
name = "raniendu-skills-validation"
version = "0.0.0"
description = "Maintenance checks for the raniendu/skills repository, not a runtime package"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "skills-ref==0.1.1",
    "ruff>=0.14,<1",
    "pymarkdownlnt>=0.9,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
