name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.17"
      - name: Install development dependencies
        run: uv sync --locked --python 3.13
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Lint Markdown
        run: uv run --locked pymarkdown scan --recurse --respect-gitignore .
      - name: Test repository tooling
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Validate skill structure and policy
        run: uv run --locked python scripts/validate.py
